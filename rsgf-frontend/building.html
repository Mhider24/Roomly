<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <title>Building View - Room Reservation</title>
        <link rel="stylesheet" href="css/styles.css?v=12">
        <link rel="icon" type="image" href="assets/images/UofM_Icon.png">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
   </head>
    <body class="building-page">
        <div id="no-js-banner" style="
        position: fixed; top: 0; left: 0; right: 0;
        z-index: 99999;
        background: #d80505;
        color: #ffffff;
        text-align: center;
        padding: 1rem;
        font-weight: bold;
        ">
        JavaScript is disabled. Please enable JavaScript to use Roomly.

        </div>

        <header class="site-header">
            <a class="brand" href="index.html" aria-label="Roomly home">
                <img src="assets/images/UofM_Icon.png" alt="University of Michigan block M">
                <span>Roomly</span>
            </a>
            <nav class="main-nav" aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a href="events.html">Events</a>
                <a href="about.html">About</a>
            </nav>
        </header>


        <main class="building-main">
            <p><a class="back-link" href="index.html#campus-map">Back to Campus Map</a></p>

            <h1 id="building-name">Loading building...</h1>

            <!-- Floorplan + controls get injected here -->
            <div id="floorplan-container"></div>

            <h3>Rooms</h3>
            <div id="room-list">
                <p>No rooms loaded yet.</p>
            </div>
        </main>

        <div id="reservation-modal" class="modal-overlay" hidden>
            <div class="modal">
                <div class="modal-header">
                    <h2>Reserve Room <span id="modal-room-id"></span></h2>
                    <button id="modal-close" type="button" aria-label="Close">&times;</button>
                </div>

                <form id="reservation-form" class="modal-form" novalidate>
                    <input type="hidden" id="form-room-id">

                    <label for="form-date">Date</label>
                    <input type="date" id="form-date" required>

                    <label for="form-start">Start Time</label>
                    <input type="time" id="form-start" required>

                    <label for="form-end">End Time</label>
                    <input type="time" id="form-end" required>

                    <label for="form-name">Reservation Name</label>
                    <input type="text" id="form-name" placeholder="e.g. Study Group" required>

                    <label for="form-umid">UMID</label>
                    <input type="text" id="form-umid" placeholder="e.g. 12345678" required>

                    <fieldset class="toggle-fieldset">
                        <legend>Invite Type</legend>
                        <label class="toggle-label">
                            <input type="checkbox" id="form-open-invite">
                            <span class="toggle-track"></span>
                            <span id="toggle-text">Closed</span>
                        </label>
                    </fieldset>

                    <div id="form-error" class="form-error" hidden></div>

                    <button type="submit" class="btn-submit">Reserve Room</button>
                </form>
            </div>
        </div>

        <!-- Leaflet JS -->
        <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
        <!-- Your logic -->
        <script type="module" src="js/building.js?v=11"></script>
        <script type="module" src="js/app.js?v=5"></script>
        <script> document.getElementById('no-js-banner').style.display = 'none'; </script>
    </body>
</html>
