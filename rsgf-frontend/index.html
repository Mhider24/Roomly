<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSGF - Room Reservation</title>

    <link rel="stylesheet" href="css/styles.css?v=6">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

</head>
<body class="home-page">

    <header class="site-header">
        <a class="brand" href="index.html" aria-label="Roomly home">
            <img src="assets/images/UofM_Icon.png" alt="University of Michigan block M">
            <span>Roomly</span>
        </a>
        <nav class="main-nav" aria-label="Main navigation">
            <a class="active" href="index.html">Home</a>
            <a href="events.html">Events</a>
            <a href="about.html">About</a>
        </nav>
    </header>

    <main>
        <section class="landing-page" aria-label="Welcome">
            <div class="landing-content">
                <p class="eyebrow">University of Michigan-Dearborn</p>
                <h1>Find your next study room.</h1>
                <p>Choose a building, explore the floorplan, and find an available room.</p>
                <a class="primary-action" href="#campus-map">Find a Room</a>
            </div>
        </section>

        <section id="campus-map" class="map-section" aria-label="Campus map">
            <h2>Campus Map</h2>
            <div id="map"></div>
        </section>

        <section class="debug-section" aria-label="Backend data">
            <h2>Buildings</h2>
            <div id="building-list"></div>

            <h2>Rooms</h2>
            <div id="room-list"></div>
        </section>
    </main>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <!-- Your map code -->
    <script src="js/map.js?v=3"></script>

    <!-- Your backend logic -->
    <script type="module" src="js/app.js?v=6"></script>
